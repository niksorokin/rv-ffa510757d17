<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Silow — Harbor Mutual · process deep-dives (sample data · fictional)</title>
<link rel="icon" href="./silow-mark.svg" type="image/svg+xml">
<style>
@font-face{ font-family:"Inter"; src:url("./inter.woff2") format("woff2"); font-weight:100 900; font-display:swap; }
:root{
  --font:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --desk: radial-gradient(1200px 600px at 80% -10%, #eef2ff 0%, rgba(238,242,255,0) 60%), radial-gradient(900px 640px at -10% 110%, #cbd6f6 0%, rgba(203,214,246,0) 60%), linear-gradient(160deg,#c4d1f4 0%,#aebfee 50%,#bfcbf2 100%);
  --frame: linear-gradient(180deg,#eff1f8 0%,#e8ebf5 100%);
  --sheet:#fdfdfc; --sheet-2:#f5f5f7; --sheet-3:#ededf1;
  --line:rgba(20,20,30,.08); --line-2:rgba(20,20,30,.13); --line-3:rgba(20,20,30,.055);
  --t1:#18181d; --t2:#4b4b55; --t3:#6f6f7a; --t4:#a9a9b2;
  --hover:rgba(20,20,30,.045); --sel:rgba(20,20,30,.075);
  --ink:#2f4a9e; --ink-2:#5a72c2; --ink-3:#8fa2dc; --ink-4:#c3cfef; --soft:#edf1fc;
  --hum:#d6dae4;
  --solid:#18181d;
  --fr-t1:rgba(18,18,32,.86); --fr-t2:rgba(18,18,32,.58); --fr-t3:rgba(18,18,32,.42);
  --fr-hover:rgba(255,255,255,.40); --fr-sel:rgba(255,255,255,.82); --fr-field:rgba(255,255,255,.5); --fr-line:rgba(18,18,32,.08);
  --green:#2f9461; --green-soft:#e4f3ea; --amber:#b87a0c; --amber-soft:#fbf5e6; --amber-line:rgba(184,122,12,.22); --amber-ink:#82560a; --red:#c8463d; --red-soft:#fbecea;
  --sh-win:0 30px 70px rgba(20,35,90,.24), 0 0 0 1px rgba(255,255,255,.4);
  --sh-sheet:0 0 0 1px rgba(20,20,40,.05), 0 1px 2px rgba(20,20,40,.05), 0 8px 24px -8px rgba(20,20,40,.10);
  --sh-pill:0 0 0 .5px rgba(20,20,40,.07), 0 1px 2px rgba(20,20,40,.09);
  --sh-card:0 0 0 1px rgba(20,20,40,.07), 0 1px 2px rgba(20,20,40,.04);
  --sh-float:0 0 0 1px rgba(20,20,40,.06), 0 24px 48px -12px rgba(20,20,40,.22), 0 4px 12px rgba(20,20,40,.06);
  --glass:rgba(253,253,252,.9);
  --calm:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 85.9%,1);
  --out:cubic-bezier(.2,.8,.2,1);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:var(--font); font-size:13.5px; line-height:1.45; color:var(--t1); background:var(--desk); -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss03"; overflow:hidden; }
button,input{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; }
.num,.tn{ font-variant-numeric:tabular-nums; }
svg.i{ flex:none; display:block; }

/* ---------- window ---------- */
.stage{ height:100dvh; padding:14px 16px 16px; display:flex; flex-direction:column; }
body.embed .stage{ padding:0; }
body.embed .win{ border-radius:0; box-shadow:none; }
.win{ flex:1; min-height:0; display:flex; flex-direction:column; border-radius:14px; overflow:hidden; box-shadow:var(--sh-win); background:var(--frame); }
.topbar{ height:44px; flex:none; display:flex; align-items:center; padding:0 12px 0 16px; gap:10px; }
.lights{ display:flex; gap:8px; margin-right:4px; }
.lights i{ width:12px; height:12px; border-radius:50%; background:#ff5f57; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12); }
.lights i:nth-child(2){ background:#febc2e; } .lights i:nth-child(3){ background:#28c840; }
.tb-mid{ flex:1; display:flex; justify-content:center; min-width:0; }
.addr{ height:28px; min-width:300px; border-radius:8px; background:var(--fr-field); display:flex; align-items:center; justify-content:center; gap:7px; font-size:12.5px; color:var(--fr-t2); padding:0 14px; white-space:nowrap; }
.addr svg{ color:var(--green); }
.tb-r{ display:flex; gap:6px; align-items:center; }
.chip-s{ height:24px; border-radius:999px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--t2); background:rgba(255,255,255,.6); white-space:nowrap; }
.chip-s i{ width:6px; height:6px; border-radius:50%; background:var(--green); }
.chip-s.sample{ background:rgba(255,255,255,.92); color:var(--t1); font-weight:500; }
.wbody{ flex:1; min-height:0; display:flex; padding:0 8px 8px 0; }

/* ---------- sidebar on the frame ---------- */
.side{ width:236px; flex:none; display:flex; flex-direction:column; padding:2px 8px 8px 10px; min-height:0; }
.brand{ display:flex; align-items:center; gap:9px; height:40px; padding:0 6px; }
.brand img{ width:26px; height:26px; border-radius:7px; background:#fff; box-shadow:var(--sh-card); padding:3px; }
.brand b{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
.brand small{ margin-left:auto; font-size:12px; color:var(--fr-t2); }
.side-scroll{ flex:1; min-height:0; overflow:auto; scrollbar-width:none; padding-top:6px; }
.nav{ height:32px; display:flex; align-items:center; gap:10px; padding:0 9px; border-radius:8px; font-size:13.5px; color:var(--fr-t1); width:100%; text-align:left; transition:background .12s; }
.nav svg{ color:var(--fr-t2); }
.nav:hover{ background:var(--fr-hover); }
.nav.on{ background:var(--fr-sel); box-shadow:var(--sh-pill); font-weight:500; }
.nav.on svg{ color:var(--t1); }
.nav .cnt{ margin-left:auto; font-size:12px; color:var(--fr-t2); font-weight:400; font-variant-numeric:tabular-nums; }
.sh{ font-size:12px; font-weight:600; color:var(--fr-t2); padding:16px 9px 6px; }
.sw{ width:10px; height:10px; border-radius:3px; flex:none; background:linear-gradient(135deg,#cdd8f6,var(--ink)); }
.nav.sub{ height:30px; font-size:13px; }
.side-foot{ flex:none; display:flex; align-items:center; gap:9px; padding:10px 6px 2px; border-top:1px solid var(--fr-line); }
.side-foot .who{ font-size:13px; line-height:1.25; } .side-foot .who small{ display:block; font-size:11.5px; color:var(--fr-t2); }

/* avatars: pastel monograms (named) or a neutral mark (anonymous) */
.av{ width:26px; height:26px; border-radius:50%; display:inline-grid; place-items:center; font-size:10.5px; font-weight:600; flex:none; letter-spacing:.01em; }
.av.lg{ width:44px; height:44px; font-size:15px; }
.av.anon{ background:#eceef3 !important; color:#6f7280 !important; box-shadow:inset 0 0 0 1px rgba(20,20,40,.08); font-weight:500; }

/* ---------- sheet ---------- */
.sheet{ flex:1; min-width:0; min-height:0; background:var(--sheet); border-radius:10px; box-shadow:var(--sh-sheet); display:flex; flex-direction:column; position:relative; overflow:hidden; }
.shead{ height:52px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px 0 20px; border-bottom:1px solid var(--line-3); }
.crumb{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--t3); white-space:nowrap; min-width:0; overflow:hidden; }
.crumb b{ color:var(--t1); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
.shead .sp{ flex:1; }
.seg{ display:inline-flex; background:var(--sheet-2); border-radius:9px; padding:2px; gap:2px; max-width:100%; overflow-x:auto; scrollbar-width:none; flex:none; }
.seg button{ height:26px; padding:0 11px; border-radius:7px; font-size:12.5px; color:var(--t2); white-space:nowrap; flex:none; }
.seg button:hover{ color:var(--t1); }
.seg button.on{ background:var(--sheet); color:var(--t1); font-weight:500; box-shadow:var(--sh-card); }
.anon-t{ display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 10px 0 8px; border-radius:8px; box-shadow:0 0 0 1px var(--line-2); font-size:12.5px; color:var(--t2); white-space:nowrap; background:var(--sheet); }
.anon-t:hover{ background:var(--sheet-2); }
.anon-t .tg{ width:28px; height:16px; border-radius:999px; background:#c9ccd6; position:relative; transition:background .2s; flex:none; }
.anon-t .tg::after{ content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .25s var(--calm); }
.anon-t.on .tg{ background:var(--solid); }
.anon-t.on .tg::after{ transform:translateX(12px); }
.anon-t b{ font-weight:500; color:var(--t1); }
.sbody{ flex:1; min-height:0; overflow:auto; scroll-behavior:smooth; }
.page{ max-width:1120px; margin:0 auto; padding:26px 40px 72px; }
.view{ display:none; }
.view.on{ display:block; animation:vin .32s var(--calm); }
@keyframes vin{ from{ opacity:0; transform:translateY(6px); } }

/* ---------- type ---------- */
h1{ font-size:27px; line-height:33px; font-weight:650; letter-spacing:-.022em; margin:0; }
h2{ font-size:18px; line-height:24px; font-weight:600; letter-spacing:-.012em; margin:0; }
h3{ font-size:14.5px; font-weight:600; letter-spacing:-.008em; margin:0; }
.lede{ margin-top:8px; color:var(--t2); font-size:14.5px; line-height:22px; max-width:780px; }
.lede b{ color:var(--t1); font-weight:600; }
.meta{ font-size:12.5px; color:var(--t3); }
.sec{ margin-top:34px; }
.sec-h{ display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.sec-h .k{ font-size:12px; color:var(--t3); font-variant-numeric:tabular-nums; }
.sec-h p{ flex-basis:100%; margin:2px 0 0; color:var(--t3); font-size:13px; }
.sec-h .r{ margin-left:auto; }
.ink{ color:var(--ink); }
.muted{ color:var(--t3); }
.note{ font-size:12.5px; color:var(--t3); margin-top:10px; }
.pill{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:6px; font-size:11.5px; font-weight:500; background:var(--sheet-2); color:var(--t2); white-space:nowrap; }
.pill.ink{ background:var(--soft); color:var(--ink); }
.pill.green{ background:var(--green-soft); color:var(--green); }
.pill.amber{ background:var(--amber-soft); color:var(--amber-ink); }
.pill.red{ background:var(--red-soft); color:var(--red); }
.banner{ display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:10px; background:var(--sheet-2); color:var(--t2); font-size:13px; margin-top:16px; }
.banner svg{ color:var(--t3); }

/* hairline tile strip */
.tiles{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; background:var(--line); border-radius:12px; overflow:hidden; box-shadow:0 0 0 1px var(--line); margin-top:20px; }
.tiles.c4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.tiles.c6{ grid-template-columns:repeat(6,minmax(0,1fr)); }
.tiles.c3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.tile{ background:var(--sheet); padding:14px 16px 13px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.tile .l{ font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile b{ font-size:23px; font-weight:600; letter-spacing:-.025em; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tile b small{ font-size:13px; font-weight:500; color:var(--t3); letter-spacing:-.01em; margin-left:3px; }
.tile .s{ font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile.hl b{ color:var(--ink); }
.tile.hl b small{ color:var(--ink); opacity:.7; }
.up{ color:var(--amber-ink); } .down{ color:var(--green); }

.card{ border-radius:12px; background:var(--sheet); box-shadow:var(--sh-card); padding:16px 18px; min-width:0; }
.card.flat{ box-shadow:none; background:var(--sheet-2); }
.g2{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:14px; }
.g2e{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
.g3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.card h3 + .meta{ margin-top:2px; }

/* bars */
.bars{ display:flex; flex-direction:column; gap:11px; margin-top:12px; }
.bar{ display:grid; grid-template-columns:minmax(120px,206px) 1fr 74px; gap:12px; align-items:center; font-size:13px; }
.bar .n{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar .n small{ display:block; font-size:11.5px; color:var(--t3); overflow:hidden; text-overflow:ellipsis; }
.track{ height:10px; border-radius:6px; background:var(--sheet-2); overflow:hidden; display:flex; }
.track i{ display:block; height:100%; background:var(--hum); }
.track i.ai{ background:var(--ink); }
.track i.l2{ background:var(--ink-3); }
.bar .v{ text-align:right; color:var(--t2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.bar .v small{ color:var(--t3); margin-left:4px; }
.legend{ display:flex; gap:14px; font-size:12px; color:var(--t3); margin-top:12px; flex-wrap:wrap; }
.legend i{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--hum); }
.legend i.ai{ background:var(--ink); }

/* rows / lists */
.rows{ border-top:1px solid var(--line); }
.row{ display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); min-width:0; }
.row .grow{ flex:1; min-width:0; }
.row .t{ font-weight:500; }
.row .d{ font-size:12.5px; color:var(--t3); margin-top:1px; }
.row .v{ font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--t2); text-align:right; }
.row .v b{ color:var(--t1); font-weight:600; }
.row.click{ cursor:pointer; border-radius:8px; }
.row.click:hover{ background:var(--hover); }
.rk{ width:22px; height:22px; border-radius:6px; background:var(--sheet-2); display:grid; place-items:center; font-size:11.5px; font-weight:600; color:var(--t2); flex:none; font-variant-numeric:tabular-nums; }
.chev{ color:var(--t4); }

/* expandable category rows */
.cat{ border-bottom:1px solid var(--line); }
.cat > button{ width:100%; display:grid; grid-template-columns:minmax(0,1fr) 180px 92px 18px; gap:14px; align-items:center; padding:12px 2px; text-align:left; }
.cat > button:hover{ background:var(--hover); border-radius:8px; }
.cat .t{ font-weight:500; }
.cat .d{ font-size:12.5px; color:var(--t3); }
.cat .v{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.cat .v small{ display:block; font-size:11.5px; color:var(--t3); }
.cat .chev{ transition:transform .2s; }
.cat.open .chev{ transform:rotate(90deg); }
.cat .tasks{ display:none; padding:0 0 12px 0; }
.cat.open .tasks{ display:block; }
.task{ display:grid; grid-template-columns:minmax(0,1fr) 120px 64px; gap:12px; padding:7px 10px; font-size:13px; border-radius:6px; }
.task:nth-child(odd){ background:var(--sheet-2); }
.task .a{ color:var(--t3); font-size:12.5px; }
.task .m{ text-align:right; font-variant-numeric:tabular-nums; color:var(--t2); }

/* week timeline */
.tl{ margin-top:12px; }
.tl-row{ display:grid; grid-template-columns:44px 1fr 58px; gap:10px; align-items:center; height:30px; }
.tl-row .dl{ font-size:12.5px; color:var(--t2); font-weight:500; }
.tl-row .dv{ font-size:12px; color:var(--t3); text-align:right; font-variant-numeric:tabular-nums; }
.tl-track{ position:relative; height:18px; border-radius:5px; background:repeating-linear-gradient(90deg, var(--sheet-2) 0 calc(100%/13 - 1px), var(--line-3) calc(100%/13 - 1px) calc(100%/13)); }
.tl-track .off{ position:absolute; top:0; bottom:0; background:rgba(184,122,12,.06); }
.tl-track i{ position:absolute; top:2px; bottom:2px; border-radius:3px; }
.tl-axis{ display:grid; grid-template-columns:44px 1fr 58px; gap:10px; margin-top:4px; }
.tl-axis div{ position:relative; height:14px; font-size:11px; color:var(--t3); font-variant-numeric:tabular-nums; }
.tl-axis div span{ position:absolute; transform:translateX(-50%); white-space:nowrap; }
.c0, .legend i.c0{ background:var(--ink) } .c1, .legend i.c1{ background:var(--ink-2) } .c2, .legend i.c2{ background:var(--ink-3) } .c3, .legend i.c3{ background:var(--ink-4) } .c4, .legend i.c4{ background:#a7adbb } .c5, .legend i.c5{ background:#d3d6de }

/* people workload */
.wl{ display:grid; grid-template-columns:minmax(150px,220px) 1fr 70px 70px 64px 16px; gap:12px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer; border-radius:6px; }
.wl:hover{ background:var(--hover); }
.wl.h{ cursor:default; font-size:12px; color:var(--t3); padding-top:4px; }
.wl.h:hover{ background:none; }
.wl .who{ display:flex; align-items:center; gap:9px; min-width:0; }
.wl .who span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wl .who small{ display:block; color:var(--t3); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; }
.wl .v{ text-align:right; font-variant-numeric:tabular-nums; color:var(--t2); white-space:nowrap; }
.stack{ height:12px; border-radius:4px; overflow:hidden; display:flex; background:var(--sheet-2); }
.stack i{ display:block; height:100%; }

/* trend columns */
.trend{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.tc{ border-radius:12px; box-shadow:var(--sh-card); padding:14px 16px; }
.tc .l{ font-size:12px; color:var(--t3); }
.tc .cols{ display:flex; align-items:flex-end; gap:8px; height:72px; margin-top:10px; }
.tc .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; }
.tc .col i{ display:block; width:100%; max-width:34px; border-radius:4px 4px 2px 2px; background:var(--hum); }
.tc .col.on i{ background:var(--ink); }
.tc .col small{ font-size:11px; color:var(--t3); white-space:nowrap; }
.tc .now{ margin-top:8px; display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--t3); }
.tc .now b{ font-size:18px; color:var(--t1); font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

/* heat table */
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:right; font-weight:500; font-size:12px; color:var(--t3); padding:8px 10px; border-bottom:1px solid var(--line-2); white-space:nowrap; }
.tbl th:first-child, .tbl td:first-child{ text-align:left; padding-left:2px; }
.tbl td{ text-align:right; padding:10px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap; }
.tbl tr.click{ cursor:pointer; } .tbl tr.click:hover td{ background:var(--hover); }
.tbl td.heat{ position:relative; padding:5px 4px; }
.tbl.heatt td:first-child{ padding-right:6px; } .tbl.heatt th{ padding:6px 4px; text-align:center; } .tbl.heatt td.heat{ text-align:center; }
.tbl td .hb{ display:inline-block; min-width:44px; padding:3px 6px; border-radius:5px; }
.scrollx{ overflow-x:auto; scrollbar-width:thin; }

/* picker */
.picker{ position:relative; display:inline-block; }
.pick-btn{ display:inline-flex; align-items:center; gap:10px; height:40px; padding:0 12px 0 8px; border-radius:10px; box-shadow:0 0 0 1px var(--line-2); background:var(--sheet); max-width:100%; }
.pick-btn:hover{ background:var(--sheet-2); }
.pick-btn .tx{ text-align:left; line-height:1.2; min-width:0; }
.pick-btn .tx b{ display:block; font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pick-btn .tx small{ display:block; font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop{ position:absolute; top:46px; left:0; width:340px; max-height:420px; display:none; flex-direction:column; background:var(--glass); backdrop-filter:blur(24px) saturate(1.5); -webkit-backdrop-filter:blur(24px) saturate(1.5); border-radius:14px; box-shadow:var(--sh-float); z-index:30; overflow:hidden; }
.pop.on{ display:flex; animation:pin .24s var(--calm); }
@keyframes pin{ from{ opacity:0; transform:translateY(-6px) scale(.985); } }
.pop input{ margin:10px; height:34px; border-radius:9px; border:0; outline:0; box-shadow:inset 0 0 0 1px var(--line-2); padding:0 12px; background:#fff; font-size:13px; }
.pop .lst{ overflow:auto; padding:0 6px 8px; }
.pop .grp{ font-size:11.5px; font-weight:600; color:var(--t3); padding:8px 8px 4px; }
.pop .it{ display:flex; align-items:center; gap:9px; width:100%; padding:6px 8px; border-radius:8px; text-align:left; }

<script>
/* Process deep-dives (v21): five cases, every step, actions inside steps, people/method spread, IT brief.

(function(){
'use strict';
const D=JSON.parse(document.getElementById('case-data').textContent);
const CASES=D.cases;
const SHORT=['Mailing packages','Adjuster replies','Exception handling','Returned mail','Claims intake'];
const UNIT={c1:'package',c2:'request',c3:'exception',c4:'return',c5:'package'};
const LABELS={
 c1:['Open mailing queue','Open policy record','Check address','Select template','Generate document','Download PDF','Rename file','Open archive','Find signed document','Download it','Merge package','Check pages','Add cover sheet','Send to print','Collect printout','Log tracking','Update status','Upload copy','Close queue item'],
 c2:['Open blocked task','Find adjuster','Draft question','Send request','Wait for reply','Wait to resume','Restore context','Check answer','Ask clarification','Wait, clarification','Check clarification','Update instruction','Close request'],
 c3:['Read exception','Open policy','Open instruction','Identify term','Compare addresses','Verify authority','Separate risk change','Draft correction','Validate correction','Link evidence','Resolve task','Discard old draft','Check guidance'],
 c4:['Select next item','Navigate to record','Read instruction','Compare address','Draft correction','Validate record','Prepare letter','Queue replacement','Archive evidence','Close task','Open private log','Double-enter log'],
 c5:['Open email','Inspect attachments','Find claim ref','Find claim','Verify match','Check prior copies','Save attachments','Classify documents','Re-key metadata','Upload documents','Wait for archive','Check copies','Link to claim','Close intake']};
const FLAGS={manual_rekey:['R','Re-keying between systems'],system_handoff:['H','Hand-off to another system'],wait:['W','Waiting'],search:['S','Searching'],decision:['D','Judgement call']};
const ST={map:{},sort:{},trace:{},method:{},last:null,cur:null};
const ACC='#2f4a9e',ACCD='#22397f',ACC2='#5a72c2';
const el=id=>document.getElementById(id);
const SB=()=>document.getElementById('sbody');
const E=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function dur(s){s=Number(s);if(s<90)return Math.round(s)+' s';if(s<5400)return (s/60).toFixed(1)+' min';const m=Math.round(s/60);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';}
function clock(s,long){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return long?h+':'+String(m).padStart(2,'0')+':'+x:String(Math.floor(s/60)).padStart(2,'0')+':'+x;}
const pct=x=>x>0&&x<1?'<1%':Math.round(x)+'%';
const num=n=>Number.isInteger(n)?String(n):Number(n).toFixed(1);
const bn=c=>c.steps.find(s=>s.n===c.bottleneck.step_n);
const med=s=>s.median_s_per_cohort_run;
const share=s=>s.share_pct_of_sum_step_medians;
const label=(c,n)=>LABELS[c.id][n-1]||c.steps[n-1].name;
const route=c=>'#case/'+c.id;
const stepurl=(c,n)=>route(c)+'/step/'+n;
const weekH=(c,s)=>c.runs_per_week*med(s)/3600;
const caseNo=c=>CASES.indexOf(c)+1;
const person=id=>D.people.find(p=>p.id===id);
const typical=c=>[...c.variants].sort((a,b)=>b.share_pct_of_runs-a.share_pct_of_runs)[0];
const vstep=(c,v)=>v.step_medians_s_per_run[String(c.bottleneck.step_n)];
const slowest=c=>[...c.variants].sort((a,b)=>vstep(c,b)-vstep(c,a))[0];
const fastest=c=>[...c.variants].sort((a,b)=>vstep(c,a)-vstep(c,b))[0];
const lcf=s=>s.charAt(0).toLowerCase()+s.slice(1);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=iso=>{const [y,m,d]=iso.split('-').map(Number);return MON[m-1]+' '+d;};
const WIN=fdate(D.window.from)+' – '+fdate(D.window.to);
function headline(c){let b=bn(c);return 'Step '+b.n+' of '+c.steps.length+' takes <em>'+pct(share(b))+'</em> of the time';}
function range(c){let a=D.people.filter(p=>c.people_ids.includes(p.id)).map(p=>p.cases.find(m=>m.case_id===c.id).bottleneck_median_s_per_run);return [Math.min(...a),Math.max(...a)];}
const flagchips=s=>'<span class="flags">'+s.flags.map(f=>'<span class="fl" title="'+FLAGS[f][1]+'">'+FLAGS[f][0]+'</span>').join('')+'</span>';
const list=a=>'<ul>'+a.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>';
const verdict=c=>c.verdict.replace(/(\d+)h (\d+)m\b/g,(x,h,m)=>h+' h '+m+' min');
const secHead=(k,t,p,r)=>'<div class="sec-h"><span class="k">'+k+'</span><h2>'+t+'</h2>'+(r?'<span class="r">'+r+'</span>':'')+(p?'<p>'+p+'</p>':'')+'</div>';

/* ---------- home ---------- */
function home(){
 const runs=CASES.reduce((a,c)=>a+c.summary.runs_count_in_window,0),steps=CASES.reduce((a,c)=>a+c.steps.length,0);
 return '<h1>Process deep-dives</h1><div class="lede">Five processes from operations and claims, with <b>every step as it is</b> — nothing grouped into stages. Each one opens on its full map with the time on every step and the slow step marked; open any step to see the actions inside it, compare how people do it, and end with a brief your IT team can start from.</div>'+
 tiles([{l:'Processes',v:CASES.length,s:'4 operations · 1 claims'},{l:'Steps mapped',v:steps,s:'every step, none merged'},{l:'People',v:D.people.length,s:'shown as pseudonyms'},{l:'Runs recorded',v:runs.toLocaleString('en-US'),s:'3 weeks · '+WIN,hl:1}],'c4')+
 '<div class="cxcards">'+CASES.map((c,i)=>{let b=bn(c),mx=Math.max(...c.steps.map(med));return '<a class="cxcard" data-casecard="'+c.id+'" href="'+route(c)+'"><span class="cn">'+(i+1)+'</span><div><div class="hl">'+headline(c)+(c.audience==='claims'?'<span class="pill ink">Claims</span>':'')+'</div><div class="t">'+E(c.title)+' · '+E(c.team)+'</div><div class="d">Slow step: <b>'+E(lcf(b.name))+'</b>, '+dur(med(b))+' per '+UNIT[c.id]+'. Fix: '+E(lcf(c.recommendation.title))+'.</div></div><div class="viz"><div class="minibar" aria-label="Typical time of each step; step '+b.n+' highlighted">'+c.steps.map(s=>'<i class="'+(s===b?'hot':'')+'" style="flex:1;height:'+Math.max(6,med(s)/mx*100).toFixed(1)+'%" title="Step '+s.n+': '+E(dur(med(s)))+'"></i>').join('')+'</div><div class="cardmeta"><span>'+c.steps.length+' steps</span><span>'+c.people_ids.length+' people</span><span>'+num(c.runs_per_week)+' runs a week</span><span>'+dur(c.summary.elapsed_run_time.median)+' a typical run</span></div></div><span class="chev">'+ic('right',14,2)+'</span></a>';}).join('')+'</div>'+
 '<div class="note">Bars show the typical (median) time of each step per run. Sample data. Fictional company, names and documents.</div>';
}

/* ---------- case header + tabs ---------- */
function casehead(c){
 let b=bn(c);
 return '<div class="cxhead"><div class="kk">Case '+caseNo(c)+' · '+E(c.title)+' · '+E(c.team)+(c.audience==='claims'?'<span class="pill ink">Claims</span>':'')+'</div><h1>'+E(verdict(c))+'</h1>'+
 tiles([{l:'Typical run',v:dur(c.summary.elapsed_run_time.median),s:c.steps.length+' steps, start to finish'},{l:'Step '+b.n+', typical',v:dur(med(b)),s:E(label(c,b.n))+' · per '+UNIT[c.id],hl:1},{l:'Share of the run',v:pct(share(b)),s:'step '+b.n+' of '+c.steps.length},{l:'Volume',v:num(c.runs_per_week)+'<small>/ week</small>',s:c.people_ids.length+' people · '+c.summary.runs_count_in_window+' runs in 3 weeks'}],'c4')+'</div>';
}
function tabs(c,view){
 let t=[['map','Map',''],['steps','All steps','/steps'],['handwork','Copying & waits','/handwork']];
 if(c.id==='c2')t.push(['waits','Adjuster waits','/waits']);
 if(c.id==='c3')t.push(['procedure','Expert vs newcomer','/procedure']);
 if(c.id==='c4')t.push(['ways','Three ways','/ways']);
 t.push(['people','People & paths','/people'],['brief','IT brief','/brief'],['end','The one step','/end']);
 let active=t.some(x=>x[0]===view)?view:'map';
 return '<div class="cxtabs">'+(view==='step'?'<a class="back" data-back href="'+route(c)+'">← '+E(SHORT[CASES.indexOf(c)])+' map</a>':'')+'<div class="seg">'+t.map(([k,l,p])=>'<a data-tab="'+k+'" class="'+(view!=='step'&&k===active?'on':'')+'" href="'+route(c)+p+'">'+l+'</a>').join('')+'</div></div>';
}

/* ---------- process map ---------- */
function mapModel(c){
 let key=ST.map[c.id]||'typical',typ=typical(c),v=key==='typical'?typ:(c.variants.find(x=>x.id===key)||typ);
 let order=v.rework_step_order||v.step_order,rows=[];
 order.forEach(n=>{if(!rows.includes(n))rows.push(n);});
 let onPath=rows.slice(),off=c.steps.map(s=>s.n).filter(n=>!rows.includes(n));
 rows=rows.concat(off);
 let lanes=[];rows.forEach(n=>{let sys=c.steps[n-1].system;if(!lanes.includes(sys))lanes.push(sys);});
 let time=n=>key==='typical'?med(c.steps[n-1]):v.step_medians_s_per_run[String(n)];
 let edges=[],seen=new Set();
 for(let i=1;i<order.length;i++){let k=order[i-1]+'>'+order[i];if(!seen.has(k)){seen.add(k);edges.push([order[i-1],order[i]]);}}
 let total=onPath.reduce((a,n)=>a+time(n),0),b=c.bottleneck.step_n;
 let shr=key==='typical'?share(bn(c)):time(b)/total*100;
 let wk=key==='typical'?weekH(c,bn(c)):c.runs_per_week*v.share_pct_of_runs/100*time(b)/3600;
 return {key,v,order,rows,onPath,off,lanes,time,edges,total,shr,wk};

 if(c.id==='c2'){let w=c.extra.wait_summary,ex=c.variants[0].example_runs[1],acts=[...new Set(ex.while_waiting_events.map(e=>e.activity.split(';')[0]))];
  return '<section class="sec" id="waits">'+secHead('03','The reply takes hours. The work takes minutes.','Waiting is calendar time, including nights and weekends. It is not idle staff time.')+
  tiles([{l:'Requests a week',v:num(w.requests_per_week),s:'to adjusters'},{l:'Typical total wait',v:dur(w.reply_wait.median),s:'per request',hl:1},{l:'Longest wait',v:dur(w.reply_wait.max),s:'in the sample'},{l:'Reminders',v:num(w.followup_reminders.median),s:'per request, typically'},{l:'Need clarification',v:pct(w.clarification_share_pct_of_requests),s:'a second round'}])+
  '<div class="two"><div class="card"><h3>Total wait per request</h3>'+[['Typical',w.reply_wait.median],['Average',w.reply_wait.mean],['Slowest 10%',w.reply_wait.p90],['Longest',w.reply_wait.max]].map(([k,v],i)=>'<div class="hbar"><span>'+k+'</span><i class="'+(i===0?'a':'')+'" style="width:'+Math.max(1,v/w.reply_wait.max*100).toFixed(1)+'%"></i><span>'+dur(v)+'</span></div>').join('')+'<p class="note">Includes the clarification round where there is one. The first reply alone (step 5) typically takes '+dur(med(bn(c)))+'.</p></div>'+
  '<div class="card"><h3>What the coordinator does meanwhile</h3><ul class="plain">'+acts.map(a=>'<li>'+E(a)+'</li>').join('')+'</ul><p class="note">Typically '+num(w.context_switches.median)+' switches to other work per request, '+dur(w.resume_delay.median)+' from the reply arriving to reopening the request, and '+dur(w.context_rebuild.median)+' to re-read the context.</p></div></div></section>';}
 if(c.id==='c3'){let p=c.extra.procedure_draft,rw=c.extra.rework_summary;
  return '<section class="sec" id="procedure">'+secHead('03','Expert and newcomer: check first, or draft twice','Same exception type. The expert verifies term and authority before drafting; newcomers draft first and redo it after the late checks in '+pct(rw.share_pct_of_newcomer_runs)+' of their runs. Click a step number to open it.')+
  '<div class="two">'+c.variants.map(v=>{let ord=v.rework_step_order||v.step_order,seen=new Set(),sys=[];ord.forEach(n=>{let s=c.steps[n-1].system;if(sys[sys.length-1]!==s)sys.push(s);});return '<div class="card"><div class="kk">'+(v.id==='expert'?'Expert path':'Newcomer path')+'</div><h3 style="margin-top:4px">'+E(v.name)+'</h3><p class="mute" style="font-size:13px;margin-top:2px">'+dur(v.median_s_per_run)+' a typical run · '+pct(v.share_pct_of_runs)+' of runs</p><div class="pathflow">'+ord.map(n=>{let again=seen.has(n);seen.add(n);return '<a class="'+(n===c.bottleneck.step_n?'hot':again?'again':'')+'" href="'+stepurl(c,n)+'" title="'+E(c.steps[n-1].name)+(again?' (again)':'')+'">'+n+'</a>';}).join('<span>→</span>')+'</div><p style="font-size:13.5px;color:var(--t2)">'+E(v.description)+'</p><p class="note">Systems in order: '+sys.map(E).join(' → ')+'</p></div>';}).join('')+'</div>'+
  '<div class="card" style="margin-top:14px" id="jobaid"><div class="kk">'+E(p.label)+'</div><h3 style="font-size:17px;margin-top:4px">Draft procedure for training: verify before drafting</h3><p class="mute" style="font-size:13px;margin-top:4px">Built from the expert path. A draft like this can be generated on request, then reviewed by an operations trainer. '+E(p.approval_status)+'.</p><ol class="procedure">'+p.steps.map(s=>'<li><div><b>'+E(s.name)+'</b><p>'+E(s.what_to_check)+'</p><small>'+E(s.system)+'</small></div></li>').join('')+'</ol></div></section>';}
 if(c.id==='c4'){let f=fastest(c);return '<section class="sec" id="ways">'+secHead('03','Twenty people, three ways to handle the same return','The signed instruction is already attached. The difference is navigation and duplicate logging.')+'<div class="ways">'+c.variants.map(v=>'<div class="card '+(v===f?'fast':'')+'"><div class="kk">'+(v===typical(c)?'Typical path · ':v===f?'Fastest · ':'Deviation · ')+pct(v.share_pct_of_runs)+' of runs</div><h3>'+E(v.name)+'</h3><p>'+E(v.description)+'</p><div class="t">'+dur(v.median_s_per_run)+'</div><p>a typical run · step '+c.bottleneck.step_n+': '+dur(vstep(c,v))+'</p><p style="margin-top:8px"><a class="link" href="'+stepurl(c,c.bottleneck.step_n)+'?trace='+v.id+'">See the navigation →</a></p></div>').join('')+'</div></section>';}
 return '';
}

/* ---------- brief ---------- */
function estimate(c){return c.runs_per_week*med(bn(c))*c.recommendation.assumed_takeover_share/3600;}
function estimateText(c){return (c.id==='c2'?'Waiting is elapsed time, not work, so no time is counted as returned. ':'')+'Calculation: '+num(c.runs_per_week)+' runs a week × '+dur(med(bn(c)))+' typical time in step '+bn(c).n+' × '+Math.round(c.recommendation.assumed_takeover_share*100)+'% assumed takeover = '+estimate(c).toFixed(1)+' hours a week. Estimate from sample data, not measured savings.';}
function briefText(c){let r=c.recommendation;return [D.company,D.label,c.title,'BRIEF FOR IT · STEP '+bn(c).n+' · '+bn(c).name,r.title,'What to build: '+r.what,'Why this step: '+c.bottleneck.why,'Trigger: '+r.trigger,'Inputs:\n- '+r.inputs.join('\n- '),'Outputs:\n- '+r.outputs.join('\n- '),'Systems: '+r.systems.join(', '),'Complexity: '+r.complexity,'Person checks (manual touchpoints):\n- '+r.manual_touchpoints.join('\n- '),'What stays with people:\n- '+r.stays_with_people.join('\n- '),'Acceptance criteria:\n- '+r.acceptance.join('\n- '),'Scope: '+c.extra.boundary,'Time back: about '+estimate(c).toFixed(1)+' hours a week. '+estimateText(c)].join('\n\n');}
function brief(c){let r=c.recommendation,b=bn(c);
 return '<section class="sec" id="brief">'+secHead('0'+(c.id==='c2'||c.id==='c3'||c.id==='c4'?5:4),'Brief for IT','Enough detail to start designing the automation: systems, inputs and outputs, where a person stays in the loop, and how to accept it.')+'<div class="briefcard"><div class="briefhead"><div><div class="kk">Step '+b.n+' · '+E(b.name)+' · '+E(c.title)+'</div><h2>'+E(r.title)+'</h2><p class="lede">'+E(r.what)+'</p></div><div class="briefactions"><button class="btn solid" data-copy>Copy brief</button><button class="btn" data-print>Print</button></div></div><div id="copystatus" class="toast" role="status"></div>'+
 '<div class="briefgrid"><div><h3>Trigger</h3><p>'+E(r.trigger)+'</p></div><div><h3>Inputs</h3>'+list(r.inputs)+'</div><div><h3>Outputs</h3>'+list(r.outputs)+'</div><div><h3>Systems</h3><p>'+E(r.systems.join(' · '))+'</p><h3 style="margin-top:12px">Complexity</h3><p>'+E(r.complexity)+'</p></div><div><h3>Manual touchpoints</h3>'+list(r.manual_touchpoints)+'</div><div><h3>Stays with people</h3>'+list(r.stays_with_people)+'</div><div class="wide"><h3>Acceptance criteria</h3>'+list(r.acceptance)+'</div><div><h3>Scope</h3><p>'+E(c.extra.boundary)+'</p></div></div>'+
 '<div class="estimate"><b data-estimate="'+estimate(c)+'">≈ '+estimate(c).toFixed(1)+' h a week</b><p><span style="color:var(--t1);font-weight:600">Time back to the team.</span> '+E(estimateText(c))+'</p></div><p class="printnote">'+E(D.company)+' · '+E(D.label)+'</p></div></section>';}

/* ---------- the one step (case ending) ---------- */
function conclusion(c){let b=bn(c),r=c.recommendation;
 return '<section class="sec" id="end">'+secHead('→','The one step to change')+'<div class="endgrid"><div><div class="l">This step</div><b>Step '+b.n+' of '+c.steps.length+' · '+E(b.name)+'</b><span>'+E(b.system)+' · '+dur(med(b))+' per '+UNIT[c.id]+' · '+pct(share(b))+' of the run · ≈ '+Math.round(weekH(c,b))+' h '+(b.kind==='wait'?'of waiting ':'')+'a week</span></div><div><div class="l">Why it is slow</div><p>'+E(c.bottleneck.why)+'</p></div><div><div class="l">What to do with it</div><p><b style="font-size:14px;display:inline;margin:0">'+E(r.title)+'.</b> '+E(r.what)+'</p></div></div>'+
 '<div class="endacts"><a class="btn solid" href="'+stepurl(c,b.n)+'">Open step '+b.n+'</a><a class="btn" href="'+route(c)+'/brief">IT brief</a>'+(caseNo(c)<CASES.length?'<a class="btn ghost" href="'+route(CASES[caseNo(c)])+'">Next case: '+E(SHORT[caseNo(c)])+' →</a>':'<a class="btn ghost" href="#cases">All cases</a>')+'</div></section>';}

/* ---------- method note ---------- */
function method(c){let b=bn(c),w=D.window;
 return '<details class="method" id="method"'+(ST.method[c.id]?' open':'')+'><summary>How these numbers are calculated</summary><ul>'+
 '<li>Sample: '+c.summary.runs_count_in_window+' completed runs by '+c.people_ids.length+' people from '+fdate(w.from)+' to '+fdate(w.to)+' ('+w.weeks+' weeks), '+num(c.runs_per_week)+' runs a week. All data is fictional.</li>'+
 '<li>“Typical time” is the median: half of the runs are faster, half slower. Runs that skip a step count as zero for that step.</li>'+
 '<li>“Share of the run” is a step’s typical time divided by the sum of all steps’ typical times. Step '+b.n+': '+dur(med(b))+' of '+dur(c.summary.sum_step_medians_s_per_cohort_run)+'.</li>'+
 '<li>“Slowest 10%”: one run in ten takes longer than this (the 90th percentile).</li>'+
 '<li>Hours a week on the map: runs a week × the step’s typical time. On a single path, only the runs that use that path are counted.</li>'+
 '<li>Time back in the brief: runs a week × typical time of step '+b.n+' × an assumed takeover share of '+Math.round(c.recommendation.assumed_takeover_share*100)+'%. The share is an assumption to test in a pilot, not a measurement. Waiting never counts as time back.</li>'+
 '<li>The step view shows one example run per path, taken from the middle of that path’s runs. Its times differ from the typical time.</li>'+
 '<li>People: each dot is that person’s median time in step '+b.n+', on the path they use most. Differences can come from case mix and familiarity, so a faster path is a lead to test, not proof of cause, and not a ranking of people.</li>'+
 (c.id==='c2'?'<li>'+E(c.extra.wait_semantics)+'</li>':'')+(c.id==='c3'?'<li>When a step is repeated in one run, the visits are added together in that step’s time.</li>':'')+
 '<li>For a reviewer to check: '+E(c.extra.domain_review)+'</li></ul></details>';}

/* ---------- step page ---------- */
const VERB={'elapsed gap':'Waiting','other task':'Other work','send reminder':'Reminder','copy field':'Copy','follow link':'Follow link','retain view':'Keep view open','review':'Review:'};
const verb=v=>VERB[v]||v.charAt(0).toUpperCase()+v.slice(1);
let lastSys=null;
const lc=t=>/^[A-Z][a-z]/.test(t)&&!/^\S*_/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t;
function actRow(a,long){let parts=String(a.object).split('; '),main=parts.shift(),gap=a.observed===false,other=a.verb==='other task';
 let note=gap?'':other?'not counted in this request':parts.join('; ');
 let sys=a.system!==lastSys||gap?E(a.system)+(gap?' · not recorded on screen':''):'';lastSys=a.system;
 let small=[note,sys].filter(Boolean).join(' · ');
 return '<li class="act'+(gap?' gap':'')+'"><span class="at">'+clock(a.t_offset_s,long)+'</span><div class="w"><b>'+E(verb(a.verb))+'</b> '+E(a.field?a.field.replaceAll('_',' ').replace('.',' · '):lc(main))+(small?'<small>'+small+'</small>':'')+(a.field?'<span class="mv">'+E(a.from_system)+' → '+E(a.to_system)+'</span>':'')+'</div><span class="d">'+dur(a.duration_s)+'</span></li>';}
function groupTrace(actions){
 let visits=[...new Set(actions.map(a=>a.visit_n).filter(Boolean))];
 if(visits.length>1)return visits.map(v=>{let acts=actions.filter(a=>a.visit_n===v);return {group:true,title:v===1?'First draft':'Redraft after the late checks',note:'Visit '+v+' · '+acts.length+' actions · '+acts.filter(a=>a.field).length+' fields copied'+(v>1?' again':''),acts,big:v>1};});
 let docs=actions.map(a=>a.doc||null);
 for(let i=0;i<actions.length;i++)if(!docs[i]){let before=docs.slice(0,i).some(Boolean),j=docs.findIndex((d,k)=>k>i&&d);if(before&&j>0)docs[i]=docs[j];}
 let cycles=[],cur=null;
 actions.forEach((a,i)=>{let d=docs[i];if(!d){cur=null;cycles.push({single:a});return;}if(!cur||cur.doc!==d){cur={doc:d,acts:[]};cycles.push(cur);}cur.acts.push(a);});
 let out=[],rej=null;
 cycles.forEach(cy=>{
  if(cy.single){rej=null;let a=cy.single,w=['elapsed gap','other task'].includes(a.verb);
   let g=out[out.length-1];if(w&&g&&g.wait){g.acts.push(a);return;}
   if(w){out.push({group:true,wait:true,acts:[a]});return;}
   out.push(a);return;}
  if(cy.acts.some(a=>a.verb==='close')){if(!rej){rej={group:true,rejected:true,acts:[],files:0,folders:0,reasons:{}};out.push(rej);}
   rej.files++;cy.acts.forEach(a=>{rej.acts.push(a);if(/^Filing-date folder/.test(a.object))rej.folders++;if(a.verb==='compare'){let k=a.object.split(/[:;]/)[0].trim();rej.reasons[k]=(rej.reasons[k]||0)+1;}});return;}
  rej=null;
  let fields=cy.acts.filter(a=>a.field).length;
  if(fields>=3)out.push({group:true,title:'Re-keyed '+fields+' fields for '+cy.doc,note:'Open the document, copy each field, check the entries',acts:cy.acts});
  else cy.acts.forEach(a=>out.push(a));
 });
 out.forEach(g=>{if(g.rejected){g.title='Opened and rejected '+g.files+' candidate file'+(g.files>1?'s':'');g.note=Object.entries(g.reasons).map(([k,n])=>k+' ('+n+')').join(' · ')+(g.folders?' · '+g.folders+' date folder'+(g.folders>1?'s':'')+' opened':'');g.big=true;}});
 return out;
}
function traceList(actions,total){let long=total>=3600,items=groupTrace(actions);lastSys=null;
 items=items.flatMap(g=>{if(!g.wait)return [g];if(g.acts.length<4)return g.acts;let k=g.acts.filter(a=>a.verb==='other task').length;g.title='Waited for the reply';g.note=k+' unrelated tasks in between, not counted in this request · not recorded on screen';g.big=true;return [g];});
 return '<ol class="acts">'+items.map(it=>{if(!it.group)return actRow(it,long);let d=it.acts.reduce((x,a)=>x+a.duration_s,0);
  return '<li><details class="grp'+(it.big?' big':'')+'"><summary><span class="at">'+clock(it.acts[0].t_offset_s,long)+'</span><div class="w"><b>'+E(it.title)+'</b><small>'+E(it.note)+'</small></div><span class="d">'+dur(d)+'</span></summary><ol class="acts">'+it.acts.map(a=>actRow(a,long)).join('')+'</ol></details></li>';}).join('')+'</ol>';}
function exampleRun(c,v){let t=v.action_trace,run=v.example_runs.find(r=>r.run_id===t.run_id),p=run?person(run.person_id):null,day=run?new Date(run.started_at_utc).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}):'';
 let sys=[...new Set(t.actions.filter(a=>a.observed!==false).map(a=>a.system))];
 return 'Example run'+(p?' by '+E(p.pseudonym):'')+(day?', '+day:'')+': <b>'+dur(t.duration_s)+'</b> in this step · '+t.actions.length+' actions · systems: '+sys.map(E).join(', ');}
function fieldsTable(s){return s.field_transfers.length?'<div class="fields"><h3>Fields copied by hand between systems</h3><div class="card" style="padding:4px 10px;margin-top:8px"><div class="scroll"><table class="cxt"><thead><tr><th>Field</th><th>From</th><th>To</th></tr></thead><tbody>'+s.field_transfers.map(f=>'<tr><td>'+E(f.field.replaceAll('_',' ').replace('.',' · '))+'</td><td>'+E(f.from_system)+'</td><td>'+E(f.to_system)+'</td></tr>').join('')+'</tbody></table></div></div></div>':'';}
function stepPage(c,n,query){
 let s=c.steps.find(x=>x.n===n);if(!s)return '<p style="margin-top:20px">Step not found.</p><a class="link" href="'+route(c)+'">Back to the case</a>';
 let hot=n===c.bottleneck.step_n,U=UNIT[c.id],body='';
 if(hot){
  let sel=ST.trace[c.id]||{left:slowest(c).id,right:fastest(c).id};
  if(query&&c.variants.some(v=>v.id===query))sel={left:query,right:query===fastest(c).id?slowest(c).id:fastest(c).id};
  ST.trace[c.id]=sel;
  let L=c.variants.find(v=>v.id===sel.left),R=c.variants.find(v=>v.id===sel.right),dl=vstep(c,L),dr=vstep(c,R),diff;
  if(L===R)diff='Same path on both sides. Choose another path to compare.';
  else{let sv=dl>=dr?L:R,fv=dl>=dr?R:L;diff='<b>'+E(sv.name)+'</b> typically takes <b>'+dur(vstep(c,sv))+'</b> in this step, <b>'+E(lcf(fv.name))+'</b> '+dur(vstep(c,fv))+': <span class="acc">'+dur(Math.abs(dl-dr))+' longer per '+U+'</span>.';}
  body='<p class="diff" id="tracediff">'+diff+'</p><div class="compare">'+[['left',L],['right',R]].map(([side,v])=>'<div class="tracecol'+(L!==R&&vstep(c,v)===Math.max(dl,dr)?' slow':'')+'" data-col="'+side+'"><header><label class="kk" style="display:block;margin-bottom:6px" for="sel-'+side+'">'+(side==='left'?'Path':'Compared with')+'</label><select id="sel-'+side+'" data-trace="'+side+'">'+c.variants.map(x=>'<option value="'+x.id+'"'+(x===v?' selected':'')+'>'+E(x.name)+'</option>').join('')+'</select><p>'+exampleRun(c,v)+'</p></header><div class="tracebody">'+traceList(v.action_trace.actions,v.action_trace.duration_s)+'</div></div>').join('')+'</div>';
 }else{
  body='<div class="single"><div class="kk" style="margin:10px 0 4px">A typical run of this step · '+dur(s.median_s_per_executed_run)+(s.kind!=='work'?' · not recorded on screen':'')+'</div>'+traceList(s.actions,s.median_s_per_executed_run)+'</div>';
 }
 let prev=n>1?'<a class="btn" data-prev href="'+stepurl(c,n-1)+'">← Step '+(n-1)+'</a>':'',next=n<c.steps.length?'<a class="btn" data-next href="'+stepurl(c,n+1)+'">Step '+(n+1)+' →</a>':'';
 return '<div class="stepwrap" id="step-panel" data-step="'+n+'"><div class="stephead"><div><div class="kk">Step '+n+' of '+c.steps.length+' · '+E(s.system)+' · '+E(s.actor_role)+'</div><h1>'+E(s.name)+'</h1><div class="stepfacts"><span><b>'+(med(s)>0?dur(med(s)):'—')+'</b> typical per '+U+'</span><span><b>'+pct(share(s))+'</b> of the run</span><span>slowest 10% over <b>'+dur(s.p90_s_per_cohort_run)+'</b></span><span>in '+s.executed_runs_count+' of '+c.summary.runs_count_in_window+' runs</span>'+(s.flags.length?flagchips(s):'')+'</div></div><div class="stepnav">'+prev+next+'</div></div>'+
 (hot?'<div class="onething" style="margin-top:16px"><p><b>This is the slow step.</b> '+E(c.bottleneck.why)+' <b>Do this:</b> '+E(lcf(c.recommendation.title))+'.</p><div class="acts2"><a class="btn solid" href="'+route(c)+'/brief">IT brief →</a></div></div>':'')+
 body+fieldsTable(s)+
 '<div class="stepfoot"><a class="btn" data-foot="map" href="'+route(c)+'">← Process map</a><a class="btn" data-foot="people" href="'+route(c)+'/people">People and paths</a><a class="btn solid" data-foot="brief" href="'+route(c)+'/brief">IT brief →</a><a class="btn ghost" data-foot="method" href="'+route(c)+'/method">How these numbers are calculated</a></div></div>';
}

/* ---------- render ---------- */
function parse(){let h=S.ch||'cases',[path,q]=h.split('?'),parts=path.split('/');return {h,parts,query:new URLSearchParams(q||'')};}
function current(){let {parts}=parse();return parts[0]==='case'?CASES.find(x=>x.id===parts[1]):null;}
function rCases(opts={}){
 let {h,parts,query}=parse(),c=current(),view=c?(parts[2]||''):'';
 let html,map=false;
 if(!c)html=home();
 else if(view==='step')html=tabs(c,'step')+stepPage(c,Number(parts[3]),query.get('trace'));
 else{html=casehead(c)+tabs(c,view)+mapsection(c)+onething(c)+table(c)+handwork(c)+extras(c)+peoplesec(c)+brief(c)+conclusion(c)+method(c);map=true;}
 let root=document.getElementById('v-cases');
 root.innerHTML='<div class="page cx">'+html+'<div class="note" style="margin-top:28px">Sample data. Fictional company, names and documents. Process steps, actions and times are illustrative.</div></div>';
 let sb=SB(),changed=ST.last!==h;ST.last=h;ST.cur=c;
 let sbh=sb.style.scrollBehavior;sb.style.scrollBehavior='auto';
 if(opts.scroll!==undefined)sb.scrollTop=opts.scroll;else if(changed)sb.scrollTop=0;
 if(map)drawMap(c);
 bind(c);
 if(changed&&opts.scroll===undefined&&c){
  let target={steps:'steps',handwork:'handwork',people:'people',brief:'brief',waits:'waits',procedure:'procedure',ways:'ways',end:'end',method:'method'}[view];
  if(target&&el(target)){if(target==='method')el('method').open=true;let tb=root.querySelector('.cxtabs');sb.scrollTop=el(target).getBoundingClientRect().top-sb.getBoundingClientRect().top+sb.scrollTop-(tb?tb.offsetHeight+8:0);}
 }
 sb.style.scrollBehavior=sbh;
}
function rerender(){rCases({scroll:SB().scrollTop});}
async function copyBrief(c){let text=briefText(c),ok=false;try{await navigator.clipboard.writeText(text);ok=true;}catch(e){let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='0';t.style.top='0';document.body.append(t);t.select();try{ok=document.execCommand('copy');}catch(ignore){}t.remove();}
 el('copystatus').textContent=ok?'Brief copied as plain text — paste it into a ticket or email.':'Automatic copy is unavailable. Select and copy the text below.';
 if(!ok){let t=document.createElement('textarea');t.className='copyfallback';t.value=text;t.setAttribute('aria-label','Plain text brief to copy');el('copystatus').after(t);t.select();}}
function bind(c){
 const R=document.getElementById('v-cases');

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function R(key){ let a=hash(key); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lr(weights,total){ const s=weights.reduce((a,b)=>a+b,0)||1; const raw=weights.map(w=>w/s*total); const fl=raw.map(Math.floor);
  let rem=total-fl.reduce((a,b)=>a+b,0); const ord=raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]); for(let k=0;k<rem;k++) fl[ord[k%ord.length][1]]++; return fl; }

PEOPLE.forEach(p=>{ const t=TEAM[p.team]; p.idx=t.members.indexOf(p)+1; p.code=t.letter+p.idx; p.pseudo=ROLES[p.role].noun+' '+p.code; p.ini=p.n.split(' ').map(x=>x[0]).join(''); });
const AI_WEEK=[.86,1,1.12];

const _pw={};
function personWeek(pid,wi){
  const k=pid+'|'+wi; if(_pw[k]) return _pw[k];
  const p=PERSON[pid], role=ROLES[p.role], team=TEAM[p.team], r=R(k);
  const total=Math.round(p.base*10*team.wf[wi]*(0.965+r()*0.07));
  const w=role.cats.map(c=>c.sh*(team.boost[wi][c.type]||1)*(0.9+R(k+c.id)()*0.2));
  const dh=lr(w,total);
  const apps={};
  const cats=role.cats.map((c,i)=>{
    const min=dh[i]*6;
    const an=Object.keys(c.apps), ad=lr(an.map(a=>c.apps[a]),dh[i]); an.forEach((a,j)=>apps[a]=(apps[a]||0)+ad[j]);
    const td=lr(c.tasks.map(t=>t[2]),dh[i]);
    return { id:c.id, n:c.n, type:c.type, ai:c.ai, dh:dh[i], min, eps:Math.max(1,Math.round(min/c.avg)), aiDh:dh[i]*c.ai,
      tasks:c.tasks.map((t,j)=>({t:t[0],app:t[1],min:td[j]*6,draft:!!t[3]})).filter(t=>t.min>0), apps:an };
  });
  const sw=+(role.sw*(0.92+R(pid+'sw')()*0.16)*Math.pow(team.wf[wi],1.6)).toFixed(1);
  const frag=Math.min(.6,role.frag*(0.9+R(pid+'fr')()*0.2)*Math.pow(team.wf[wi],2));
  const aiShare=p.ai[0]*AI_WEEK[wi];
  const tl=timeline(p,wi,cats,total);
  const o={ p, wi, dh:total, min:total*6, cats, apps, eps:cats.reduce((a,c)=>a+c.eps,0), aiDh:cats.reduce((a,c)=>a+c.aiDh,0),
    sw, frag, aiShare, aiAssistDh:Math.round(total*aiShare), tools:p.ai[1], ...tl };
  return _pw[k]=o;
}
function timeline(p,wi,cats,total){
  const r=R(p.id+'tl'+wi);
  const dayDh=lr([1.03,1,1.05,1.01,.93].map(x=>x*(0.92+r()*0.16)),total);
  let blocks=[];
  cats.forEach(c=>{ let left=c.min; while(left>0){ let sz=(3+Math.floor(r()*12))*6; if(left-sz<18) sz=left; blocks.push({cat:c.id,min:sz}); left-=sz; } });
  for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; }
  const days=[]; let after=0, longest=0;
  const late = TEAM[p.team].wf[wi]>1.06 ? 1 : 0;
  dayDh.forEach((ddh,d)=>{
    let need=ddh*6; const list=[];
    while(need>0 && blocks.length){ const b=blocks.shift(); if(b.min<=need){ list.push(b); need-=b.min; } else { list.push({cat:b.cat,min:need}); blocks.unshift({cat:b.cat,min:b.min-need}); need=0; } }
    let t=Math.round(p.st*60 + (r()*30-12) - (late? 20:0)); let worked=0, lunch=false; const out=[];
    list.forEach(b=>{
      const last=out[out.length-1];
      if(last && last.cat===b.cat && last.e===t){ last.e+=b.min; } else out.push({cat:b.cat,s:t,e:t+b.min});
      t+=b.min; worked+=b.min;
      if(!lunch && worked>=230){ t+=30+Math.floor(r()*4)*6; lunch=true; } else t+=Math.floor(r()*3)*6;
    });
    // evening log-ins: on heavy weeks people come back after dinner
    const evening = late ? r()<0.55 : r()<0.12;
    if(evening && out.length>2){ const lb=out[out.length-1]; const mv=Math.min(lb.e-lb.s-6, (5+Math.floor(r()*6))*6);
      if(mv>=24){ lb.e-=mv; const s=19*60+6*Math.floor(r()*5); out.push({cat:lb.cat,s,e:s+mv}); } }
    out.forEach(b=>{ after+=Math.max(0,450-b.s)-Math.max(0,450-b.e)+Math.max(0,b.e-1080)-Math.max(0,b.s-1080); longest=Math.max(longest,b.e-b.s); });
    days.push({d:DAYS[d],min:ddh*6,blocks:out,start:out.length?out[0].s:0,end:out.length?out[out.length-1].e:0});
  });
  return { days, afterMin:after, longest };
}
function teamWeek(tid,wi){
  const t=TEAM[tid]; const ppl=t.members.map(p=>personWeek(p.id,wi));
  const cats={}, apps={}, types={};
  ppl.forEach(pw=>{ pw.cats.forEach(c=>{ const x=cats[c.id]||(cats[c.id]={id:c.id,n:c.n,type:c.type,dh:0,aiDh:0,eps:0,people:0,tasks:{}});
      x.dh+=c.dh; x.aiDh+=c.aiDh; x.eps+=c.eps; if(c.dh>0) x.people++; c.tasks.forEach(tk=>{ x.tasks[tk.t]=(x.tasks[tk.t]||0)+tk.min; });
      types[c.type]=(types[c.type]||0)+c.dh; });
    Object.entries(pw.apps).forEach(([a,v])=>apps[a]=(apps[a]||0)+v); });
  const dh=ppl.reduce((a,x)=>a+x.dh,0);
  const wavg=f=>ppl.reduce((a,x)=>a+f(x)*x.dh,0)/dh;
  return { t, wi, ppl, dh, cats:Object.values(cats).sort((a,b)=>b.dh-a.dh), apps, types,
    eps:ppl.reduce((a,x)=>a+x.eps,0), aiDh:ppl.reduce((a,x)=>a+x.aiDh,0), sw:wavg(x=>x.sw), frag:wavg(x=>x.frag),
    afterMin:ppl.reduce((a,x)=>a+x.afterMin,0), adopters:ppl.filter(x=>x.aiShare>0).length, aiAssistDh:ppl.reduce((a,x)=>a+x.aiAssistDh,0),
    longestMed:median(ppl.map(x=>x.longest)) };
}
function companyWeek(wi){
  const tw=TEAMS.map(t=>teamWeek(t.id,wi)); const types={}, apps={};
  tw.forEach(x=>{ Object.entries(x.types).forEach(([k,v])=>types[k]=(types[k]||0)+v); Object.entries(x.apps).forEach(([k,v])=>apps[k]=(apps[k]||0)+v); });
  const dh=tw.reduce((a,x)=>a+x.dh,0);
  return { tw, wi, dh, types, apps, people:PEOPLE.length, eps:tw.reduce((a,x)=>a+x.eps,0), aiDh:tw.reduce((a,x)=>a+x.aiDh,0),
    afterMin:tw.reduce((a,x)=>a+x.afterMin,0), adopters:tw.reduce((a,x)=>a+x.adopters,0), aiAssistDh:tw.reduce((a,x)=>a+x.aiAssistDh,0),
    sw:tw.reduce((a,x)=>a+x.sw*x.dh,0)/dh, frag:tw.reduce((a,x)=>a+x.frag*x.dh,0)/dh };
}

const _ev={};
function evidence(sid){
  if(_ev[sid]) return _ev[sid];
  const s=SUG[sid]; let dh=0, eps=0; const ppl=new Set(), apps=new Set(), teams=new Set();
  [0,1,2].forEach(wi=>s.src.forEach(([tid,cid])=>{ teams.add(tid); TEAM[tid].members.forEach(p=>{ const pw=personWeek(p.id,wi); pw.cats.forEach(c=>{ if(c.id===cid && c.dh){ dh+=c.dh; eps+=c.eps; ppl.add(p.id); c.apps.forEach(a=>apps.add(a)); } }); }); }));
  const obs=dh/3/10; const back=Math.round(obs*s.take*10)/10;

}

/* ---------- processes & automation ---------- */
function costCtl(){ return `<div class="roi-bar"><span class="as"><b>Model, not a promise</b> · value = hours back × 4.33 weeks × loaded hourly cost · payback = build effort ÷ hours back</span>
  <span class="cost"><span class="meta">Loaded cost</span><button class="st" id="cminus" aria-label="Lower">−</button><input type="range" id="crange" min="30" max="120" step="5" value="${S.cost}" aria-label="Loaded hourly cost"><button class="st" id="cplus" aria-label="Higher">+</button><output id="cout">${money(S.cost)}/h</output></span></div>`; }
function bindCost(){ const set=v=>{ S.cost=Math.max(30,Math.min(120,v)); rPlan(); if(S.sel) openSug(S.sel,true); };
  $('#crange').oninput=e=>set(+e.target.value); $('#cminus').onclick=()=>set(S.cost-5); $('#cplus').onclick=()=>set(S.cost+5); }
function rPlan(){
  const rois=DIRS.map(d=>({d,r:dirRoi(d.id,S.cost)}));
  const back=rois.reduce((a,x)=>a+x.r.back,0), eff=rois.reduce((a,x)=>a+x.r.eff,0);
  const ppl=new Set(); PLAN.forEach(s=>evidence(s.id).people.forEach(p=>ppl.add(p)));
  const month=back*WEEKS_PER_MONTH*S.cost;

const STOP = new Set('the a an of to in on for and or is are was were be do does did what whats which who whom how much many our we us you your i me my it its this that these those with at by from as about can could would should will there their they them any some me please tell show give'.split(' '));
function norm(s){ return ' '+s.toLowerCase().replace(/[’']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9%$\- ]+/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim()+' '; }
function toks(s){ return norm(s).trim().split(' ').filter(Boolean); }
function dl(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=[]; for(let i=0;i<=m;i++){ d[i]=[i]; } for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){ const c=a[i-1]===b[j-1]?0:1; d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c); if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); } return d[m][n]; }
function tokMatch(q,k){ if(q===k) return true; if(k.length>=4 && q.length>=4 && (q.startsWith(k)||k.startsWith(q)) && Math.min(q.length,k.length)>=4) return true;
  if(k.length>=4 && q.length>=4){ const d=dl(q,k); return k.length<=6 ? d<=1 : d<=2; } return false; }
function has(qt, qn, phrase){ // phrase match: exact substring, or every word fuzzily present
  const pn=norm(phrase); if(qn.includes(pn)) return 1;
  const pw=pn.trim().split(' ').filter(w=>!STOP.has(w)); if(!pw.length) return 0;
  return pw.every(w=>qt.some(t=>tokMatch(t,w))) ? (pw.length>1?.9:.8) : 0;
}

function entities(q){
  const qn=norm(q), qt=toks(q), e={};
  for(const [id,al] of Object.entries(TEAM_AL)) for(const a of al){ const an=norm(a); if(qn.includes(an) || (an.trim().length>=6 && an.trim().split(' ').length===1 && qt.some(t=>tokMatch(t,an.trim())))){ e.team=e.team||id; break; } }
  for(const [id,al] of Object.entries(DIR_AL)) for(const a of al){ if(qn.includes(norm(a))){ e.dir=e.dir||id; break; } }
  for(const [id,al] of Object.entries(PROC_AL)) for(const a of al){ if(qn.includes(norm(a))){ e.proc=e.proc||id; break; } }
  for(const [id,al] of Object.entries(SUG_AL)) for(const a of al){ if(qn.includes(norm(a))){ e.sug=e.sug||id; break; } }
  for(const a of APPS){ const an=norm(a).trim(); if(qn.includes(' '+an+' ') || (an.length>=6 && qt.some(t=>tokMatch(t,an.replace(/ /g,''))))){ e.app=e.app||a; } }

    const codeHit = qt.includes(p.code.toLowerCase());
    const [f,l]=p.n.toLowerCase().split(' ');
    const full = norm(p.n); const okf=!NAME_AMBIG.has(f), okl=!NAME_AMBIG.has(l);
    const nameHit = qn.includes(full) || qt.some(t=>(okf&&(t===f||(t.length>=6&&f.length>=6&&dl(t,f)<=1)))||(okl&&(t===l||(t.length>=6&&l.length>=6&&dl(t,l)<=1))));

  }

}

function classify(q){
  const e=entities(q); e.q=q; const qn=norm(q), qt=toks(q).filter(t=>!STOP.has(t));
  let best=null, bs=0;
  for(const it of INTENTS){
    if(it.need && !e[it.need]) continue;
    let sc=0; for(const [ph,w] of it.kw){ const m=has(qt,qn,ph); if(m) sc+=w*m; }
    if(it.need && sc>0) sc+=1.2;
    if(it.id==='company_time' && (e.team||e.person)) sc-=1;
    if(it.id==='roi' && (e.dir||e.sug)) sc+=.4;
    if(it.id==='process' && e.proc) sc+=.8;
    if(it.id==='apps' && e.app) sc+=1;
    if(sc>bs){ bs=sc; best=it; }
  }
  if(bs<1.4){ if(e.person) best=INTENTS.find(i=>i.id==='person_time'); else if(e.team) best=INTENTS.find(i=>i.id==='team_overview'); else if(e.proc) best=INTENTS.find(i=>i.id==='process'); else if(e.app) best=INTENTS.find(i=>i.id==='apps'); else best=null; }
  return { intent: best ? best.id : 'fallback', e, score:+bs.toFixed(2) };
}
function answer(m){
  const { intent, e } = m;
  if(e.person && e.byName && S.anon && ['person_time','person_recs','person_knows'].includes(intent))
    return {h:`<p><b>Anonymous mode is on</b>, so I won’t look people up by name or map a name to a pseudonym. Ask about a role or code — for example “what does ${PEOPLE[12].pseudo} work on?” — or switch to Named if your admins allow it.</p>`, s:[chipDoc('Privacy principles')]};
  if(intent==='fallback') return {h:`<p>I don’t have a prepared answer for that in this sample. In production I answer any question from <b>your own recorded work</b>, on your own models.</p><p>Here I can tell you where time goes, what to automate first and what it’s worth, who knows what, where work waits, AI adoption, process steps, and how deployment and privacy work.</p>`, s:[chipDoc('Sample demo')]};
  const it=INTENTS.find(i=>i.id===intent); return it.fn(e, e.q);
}
const SUGGEST = [...CX.suggest, 'Where does Claims intake’s time go?','What should we automate first?','What is the ROI for claims testing?','Who knows the reinsurance bordereaux?','Where does work wait the longest?','Does anything leave our network?','How do you handle PHI?','How is it installed?'];
function rAsk(){
  const hero = S.msgs.length ? '' : `<div class="ask-hero"><img src="./silow-mark.svg" alt=""><h1>Ask about Harbor Mutual’s work</h1><p>Answers come from recorded work — processes step by step, people, teams and the plan.</p><div class="sugs">${SUGGEST.slice(0,9).map(s=>`<button data-ask="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
  const msgs = S.msgs.map((m,i)=>{ const a = m.pending ? null : answer(m);
    return `<div class="mq">${esc(m.q)}</div><div class="ma" data-intent="${m.intent}"><span class="lg"><img src="./silow-mark.svg" alt=""></span><div>${a?a.h+`<div class="src">${a.s.join('')}${chipDoc('On-prem · your models')}</div>`:'<span class="typing"><i></i><i></i><i></i></span>'}</div></div>`; }).join('');
  $('#v-ask').innerHTML = `<div class="chat"><div class="chat-col">${hero}<div class="msgs" id="msgs">${msgs}</div>${S.msgs.length?`<div class="sugs" style="justify-content:flex-start;margin-top:20px">${SUGGEST.filter(s=>!S.msgs.some(m=>m.q===s)).slice(0,4).map(s=>`<button data-ask="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}</div>
    <div class="composer-wrap"><form class="composer" id="cform"><input id="cq" placeholder="Ask anything about the work — any wording" autocomplete="off" aria-label="Ask Silow"><button class="send" aria-label="Send">${ic('up',16,2.2)}</button></form>
    <div class="composer-f">${ic('lock',12,2)}Sample demo · prepared answers · in production Silow answers from your own data on your own models</div></div></div>`;
  $('#cform').onsubmit = ev=>{ ev.preventDefault(); ask($('#cq').value); };
  $$('[data-ask]').forEach(b=>b.onclick=()=>ask(b.dataset.ask));
  const sb=$('#sbody'); sb.style.scrollBehavior='auto'; sb.scrollTop=sb.scrollHeight; sb.style.scrollBehavior='';
}
function ask(q){ q=(q||'').trim(); if(!q) return; const c=classify(q); const m={q, ...c, pending:true}; S.msgs.push(m); window.__lastIntent=c; rAsk();
  setTimeout(()=>{ m.pending=false; if(S.view==='ask') rAsk(); setTimeout(()=>{ const i=$('#cq'); if(i && !matchMedia('(max-width:900px)').matches) i.focus(); },0); }, 520); }
